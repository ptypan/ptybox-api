buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Alineado con ptybox-app (AGP 8.13.2). Necesario porque este repositorio
        // ahora incluye terminal-emulator y termux-shared, que usan
        // externalNativeBuild y necesitan un AGP capaz de manejar NDK 29.
        classpath "com.android.tools.build:gradle:8.13.2"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        //mavenLocal()
        maven { url "https://jitpack.io" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
