apply plugin: 'com.android.application'

// =============================================================================
// PtyBox - firma. La API y la app comparten sharedUserId=com.ptybox, asi que
// Android exige que ambas APKs esten firmadas con la MISMA clave. Se lee de
// 'keystore.properties' (gitignored) o de variables de entorno, igual que en
// ptybox-app. Ver scripts/gen_keystore.sh.
// =============================================================================
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
def keystorePropsLoaded = false
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
    keystorePropsLoaded = true
}
def propOrEnv = { String key, String env ->
    if (keystorePropsLoaded && keystoreProps.containsKey(key)) return keystoreProps.getProperty(key)
    return System.getenv(env)
}
def ksStoreFile = propOrEnv("storeFile", "PTYBOX_STORE_FILE")
def ksStorePass = propOrEnv("storePassword", "PTYBOX_STORE_PASSWORD")
def ksKeyAlias = propOrEnv("keyAlias", "PTYBOX_KEY_ALIAS")
def ksKeyPass = propOrEnv("keyPassword", "PTYBOX_KEY_PASSWORD")
def hasReleaseSigning = ksStoreFile != null && ksStorePass != null && ksKeyAlias != null && ksKeyPass != null

if (!hasReleaseSigning) {
    logger.lifecycle("[PtyBox] Sin keystore configurado: se usara la clave de depuracion. " +
        "La API NO podra compartir sharedUserId con la app firmada.")
}

android {
    namespace "com.ptybox.api"

    compileSdk project.properties.compileSdkVersion.toInteger()
    def appVersionName = System.getenv("TERMUX_API_APP__BUILD__APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("TERMUX_API_APP__BUILD__APK_VERSION_TAG") ?: ""

    defaultConfig {
        applicationId "com.ptybox.api"
        minSdk project.properties.minSdkVersion.toInteger()
        targetSdk project.properties.targetSdkVersion.toInteger()
        versionCode 1003
        versionName "0.53.0-ptybox1"

        if (appVersionName) versionName = appVersionName
        validateVersionName(versionName)

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "com.ptybox"
        manifestPlaceholders.TERMUX_APP_NAME = "PtyBox"
        manifestPlaceholders.TERMUX_API_APP_NAME = "PtyBox:API"
    }

    signingConfigs {
        // Upstream firma con 'testkey_untrusted.jks', clave PUBLICA. No la
        // usamos: app y API deben ir firmadas con la MISMA clave propia para
        // compartir sharedUserId=com.ptybox.
        // Ver scripts/gen_keystore.sh en el repositorio ptybox-app.
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(ksStoreFile)
                storePassword ksStorePass
                keyAlias ksKeyAlias
                keyPassword ksKeyPass
            }
            debug {
                storeFile rootProject.file(ksStoreFile)
                storePassword ksStorePass
                keyAlias ksKeyAlias
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false // Reproducible builds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }

        debug {
            if (hasReleaseSigning) signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = new File("ptybox-api_" +
                    (apkVersionTag ? apkVersionTag : "v" + versionName + "-" + variant.buildType.name) + ".apk")
        }
    }

    packagingOptions {
        // Remove terminal-emulator and termux-shared JNI libs added via termux-shared dependency
        exclude "lib/*/libtermux.so"
        exclude "lib/*/liblocal-socket.so"
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.1.5"

    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.biometric:biometric:1.2.0-alpha05"
    implementation "androidx.media:media:1.7.0"
    implementation "androidx.preference:preference:1.2.1"

    // Modulo embebido (ver settings.gradle): garantiza que la API compila
    // contra el MISMO TermuxConstants que la app, con TERMUX_PACKAGE_NAME ya
    // cambiado a com.ptybox.
    implementation project(":termux-shared")

    implementation "com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava"
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}

@SuppressWarnings("UnnecessaryQualifiedReference")
static def validateVersionName(String versionName) {
    // https://semver.org/spec/v2.0.0.html#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
    // ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    if (!java.util.regex.Pattern.matches("^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?\$", versionName))
        throw new GradleException("The versionName '" + versionName + "' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html.")
}
